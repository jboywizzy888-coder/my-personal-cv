<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Badge icons</title>
    <link rel="stylesheet" href="/amaka.css">
</head>

<body>
    <section class="row">

        <div class="daily">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="64" height="64" fill="none"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img"
                aria-label="Moisture">
                <circle cx="30" cy="30" r="28" />
                <path d="M6 36h48" />
                <path d="M30 12c-6 8-9 12-9 16a9 9 0 0 0 18 0c0-4-3-8-9-16z" />
                <path d="M10 40q5-4 10 0t10 0t10 0t10 0" />
                <path d="M10 46q5-4 10 0t10 0t10 0t10 0" />
            </svg>
            <p>Daily Hydration For Healthy Skin</p>
            <p class="plusi">+</p>
        </div>

        <div class="intensive">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="64" height="64" fill="none"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img"
                aria-label="Deep moisture">
                <circle cx="30" cy="30" r="28" />
                <path d="M6 36h48" />
                <path d="M15 16c-3 4-5 6-5 9a5 5 0 0 0 10 0c0-3-2-5-5-9z" />
                <path d="M30 16c-3 4-5 6-5 9a5 5 0 0 0 10 0c0-3-2-5-5-9z" />
                <path d="M45 16c-3 4-5 6-5 9a5 5 0 0 0 10 0c0-3-2-5-5-9z" />
                <path d="M10 40q5-4 10 0t10 0t10 0t10 0" />
                <path d="M10 46q5-4 10 0t10 0t10 0t10 0" />
            </svg>
            <p>Intensive Care For Very Dry Skin</p>
            <p>+</p>
        </div>

        <div class="enhancing">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="64" height="64" fill="none"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img"
                aria-label="Glow">
                <circle cx="30" cy="30" r="28" />
                <path d="M6 36h48" />
                <path d="M26 13c1 8 3 10 11 11-8 1-10 3-11 11-1-8-3-10-11-11 8-1 10-3 11-11z" />
                <path d="M43 24c.5 3.5 1.5 4.5 5 5-3.5.5-4.5 1.5-5 5-.5-3.5-1.5-4.5-5-5 3.5-.5 4.5-1.5 5-5z" />
                <path d="M10 40q5-4 10 0t10 0t10 0t10 0" />
                <path d="M10 46q5-4 10 0t10 0t10 0t10 0" />
            </svg>
            <p>Enhancing Skin's Natural Radiance</p>
            <p>+</p>
        </div>

        <div class="soothing">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="64" height="64" fill="none"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img"
                aria-label="Care">
                <circle cx="30" cy="30" r="28" />
                <path d="M6 36h48" />
                <path d="M30 31c-10-7-13-10-13-15a7 7 0 0 1 13-3 7 7 0 0 1 13 3c0 5-3 8-13 15z" />
                <path d="M10 40q5-4 10 0t10 0t10 0t10 0" />
                <path d="M10 46q5-4 10 0t10 0t10 0t10 0" />
            </svg>
            <p>Soothing Solutions For Eczema-Prone Skin</p>
            <p>+</p>
        </div>

        <div class="gentle">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="64" height="64" fill="none"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" role="img"
                aria-label="Cool">
                <circle cx="30" cy="30" r="28" />
                <path d="M6 36h48" />
                <g transform="translate(26 22)">
                    <path d="M0-11v22M-9.5-5.5l19 11M-9.5 5.5l19-11" />
                    <path d="M-3-9L0-6l3-3M-3 9L0 6l3 3" />
                </g>
                <g transform="translate(46 14) scale(.4)">
                    <path d="M0-11v22M-9.5-5.5l19 11M-9.5 5.5l19-11" />
                </g>
                <path d="M10 40q5-4 10 0t10 0t10 0t10 0" />
                <path d="M10 46q5-4 10 0t10 0t10 0t10 0" />
            </svg>
            <p>Gentle Hydration For Sensitive Skin</p>
            <p>+</p>
        </div>

    </section>
</body>

</html>
